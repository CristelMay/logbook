name: CI

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logbook_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logbook_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: development
      SECRET_KEY: ci-secret-key
      DB_NAME: logbook_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSLMODE: disable
      DB_CONNECT_TIMEOUT: 10
      DB_TIMEZONE: Asia/Manila
      USE_DJANGO_MIGRATIONS: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: dummy-key
      SUPABASE_BUCKET: profile-pictures
      SUPABASE_SIGNED_SECONDS: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          if [ -f theme/static_src/package-lock.json ]; then
            npm ci --prefix theme/static_src
          else
            npm install --prefix theme/static_src
          fi

      - name: Build Tailwind assets
        run: npm run build --prefix theme/static_src
