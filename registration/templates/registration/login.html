{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-cover bg-center flex items-center justify-center p-4 sm:p-8 md:p-12 lg:p-20" style="background-image: url('{% static 'images/login-bg.png' %}'); font-family: 'Poppins', sans-serif;">

    <div class="bg-[#F0F7FF] rounded-2xl md:rounded-[3rem] border-4 border-[#00459E] shadow-lg flex flex-col md:flex-row overflow-hidden w-full max-w-7xl">

        <!-- Left: Form -->
        <div class="w-full md:w-[40%] p-6 sm:p-8 md:p-12 flex flex-col">
            <img src="{% static 'images/innodata-logo.png' %}" alt="Innodata Logo" class="h-7 w-auto mb-6 object-contain self-start">

            <div class="flex flex-col justify-center items-stretch flex-1 md:px-8">
                <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 mb-8 md:mb-14 text-center">Login</h2>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-black mb-1">Username</label>
                        <input type="text" name="username" placeholder="e.g. juandelacruz"
                            class="w-full border-0 border-b border-gray-300 bg-transparent px-0 py-2 text-sm focus:outline-none focus:border-[#00459E]">
                    </div>

                    <div class="mb-2">
                        <label class="block text-sm font-medium text-black mb-1">Password</label>
                        <div class="relative">
                            <input id="password" type="password" name="password" placeholder="Enter your password"
                                class="w-full border-0 border-b border-gray-300 bg-transparent px-0 py-2 text-sm focus:outline-none focus:border-[#00459E] pr-10">
                            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center text-gray-400 hover:text-gray-600">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="text-right mb-8">
                        <a href="#" class="text-xs text-[#00459E] hover:underline">Forgot password?</a>
                    </div>

                    <button type="submit" class="w-full bg-[#00459E] text-white font-semibold py-2 rounded-lg hover:bg-blue-800 transition text-sm">Login</button>
                </form>

                <p class="text-center text-sm text-gray-500 mt-4">
                    Don't have an account? <a href="#" class="text-[#00459E] font-medium hover:underline">Sign up</a>
                </p>
            </div>
        </div>

        <!-- Right: Image -->
        <div class="hidden md:flex md:w-[60%] items-center justify-center">
            <img src="{% static 'images/login-img.png' %}" alt="Login Illustration" class="object-contain w-full h-full">
        </div>

    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.956 9.956 0 012.293-3.95M6.634 6.634A9.956 9.956 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.176 5.191M15 12a3 3 0 01-4.243 4.243M9.88 9.88a3 3 0 014.243 4.243M3 3l18 18" />`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }
    </script>

</body>
</html>
