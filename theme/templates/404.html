{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4" style="font-family: 'Poppins', sans-serif;">
    <div class="w-full max-w-xl text-center bg-white border-2 border-slate-200 rounded-3xl shadow-lg p-10">
        <p class="text-sm font-semibold tracking-wide text-slate-500">ERROR 404</p>
        <h1 class="text-4xl font-bold text-slate-800 mt-2">Page Not Found</h1>
        <p class="text-slate-600 mt-4">The page you are trying to access does not exist or you are not authorized to view it.</p>
        <a href="{% url 'registration:login' %}" class="inline-block mt-8 bg-[#00459E] text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-800 transition">Back to Login</a>
    </div>
</body>
</html>
