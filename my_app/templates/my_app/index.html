{% extends 'base.html' %}

{% block title %}My App - Home{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">
            Welcome to My App!
        </h2>
        <p class="text-gray-600 mb-4">
            This is a sample app demonstrating the proper Django app structure.
        </p>
        
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-4">
            <p class="text-sm text-blue-700">
                <strong>Template Location:</strong> my_app/templates/my_app/index.html
            </p>
        </div>

        <div class="mt-6">
            <a href="{% url 'my_app:detail' item_id=1 %}" 
               class="inline-block px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
                View Sample Detail Page
            </a>
        </div>
    </div>
</div>
{% endblock %}
