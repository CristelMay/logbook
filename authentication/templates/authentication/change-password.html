{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4" style="font-family: 'Poppins', sans-serif;">
    <div class="w-full max-w-xl bg-white rounded-3xl border-2 border-[#00459E] p-8 shadow-lg">
        <h1 class="text-3xl font-bold text-[#00459E] mb-2">Change Temporary Password</h1>
        <p class="text-sm text-slate-600 mb-6">You must update your temporary password before continuing.</p>

        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <p class="text-sm {% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'registration:change_password' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-black mb-1">New Password</label>
                <input type="password" name="new_password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-black mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" required>
            </div>
            <button type="submit" class="w-full bg-[#00459E] text-white py-2.5 rounded-lg font-semibold hover:bg-blue-800 transition">Update Password</button>
        </form>
    </div>
</body>
</html>
